[package]
name = "datastar-aether"
version = "0.2.0"
license = "MIT"
description = "Aether SDK for Datastar — hypermedia-driven UIs over SSE"
repository = "https://github.com/aether-lang-dev/datastar-aether"
readme = "README.md"
# What `ae add` consumers can import: `import datastar`. Nothing else in the
# repo (harness, cmd, tests) is a supported API.
modules = "datastar"
keywords = ["datastar", "sse", "hypermedia", "web"]

# No [dependencies]: the SDK needs only the stdlib, and a dependency declared
# here would be resolved transitively for every consumer. The Selenium binding
# the component tests use is declared in tests/component/aether.toml instead.

[build]
target = "native"

[[bin]]
name = "datastar-testserver"
path = "cmd/testserver/main.ae"

[[bin]]
name = "datastar-helloworld"
path = "cmd/examples/helloworld/main.ae"

[[bin]]
name = "datastar-hotreload"
path = "cmd/examples/hotreload/main.ae"
